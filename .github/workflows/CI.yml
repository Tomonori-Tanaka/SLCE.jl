name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: tests — Julia ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.12"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # TEST_MODE=all: unit + Aqua + JET. The extension suites (Sunny / GLMNet) run
      # in their own job below; only the oracle stays local-only, because it needs a
      # Magesty checkout that is not published anywhere CI can reach.
      #
      # JULIA_NUM_THREADS > 1 is REQUIRED, not a speed knob: the threaded-vs-serial
      # gates (`test_threading.jl`, and the deterministic basis build in
      # `test_salc.jl`) compare a parallel result against a serial reference, and at
      # one thread `Threads.@threads` runs the reference's own code path — the
      # assertions pass without exercising anything. A data race in the orbit loop or
      # in a design-matrix builder is invisible to a single-threaded CI.
      - uses: julia-actions/julia-runtest@v1
        env:
          TEST_MODE: all
          JULIA_NUM_THREADS: "4"

  extensions:
    name: extension suite — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [sunny, glmnet]
    steps:
      # `ext/SLCESunnyExt.jl` and `ext/SLCEGLMNetExt.jl` are only loaded when their
      # trigger package is present, so NOTHING in the main job compiles them — the
      # extensions were shipping on the strength of a local run. Both triggers are
      # registered packages that install fine here; the suites carry their own
      # environment (`test/<suite>/Project.toml`, `[sources]`-deved onto this
      # checkout) and their own Manifest, so this also catches a resolver break.
      #
      # The oracle suite is deliberately NOT here: it needs a sibling Magesty
      # checkout, which is not a registered package.
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate the ${{ matrix.suite }} environment
        run: julia --project=test/${{ matrix.suite }} -e 'using Pkg; Pkg.instantiate()'
      - name: Run the ${{ matrix.suite }} suite
        run: julia --project=test/${{ matrix.suite }} test/${{ matrix.suite }}/runtests.jl
        env:
          JULIA_NUM_THREADS: "4"

  integration:
    name: integration tier — whole pipeline on real crystals
    runs-on: ubuntu-latest
    steps:
      # Whole-pipeline passes on six named crystals (test/integration/README.md).
      # It carries its own environment because it needs Spglib, and `Pkg.test()`
      # must never depend on a symmetry backend — the unit fixtures assemble their
      # space groups by hand for exactly that reason. Here a hand-assembled group
      # would defeat the purpose: the tier is about the path a user takes, and
      # Spglib is an independent implementation of the one thing those fixtures
      # would otherwise assert about themselves.
      #
      # This job is not a duplicate of the unit suite. It is the tier that found a
      # zero-column basis being fitted as an intercept, and it is where a defect
      # that only appears when the STAGES are composed will show up first.
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate the integration environment
        run: julia --project=test/integration -e 'using Pkg; Pkg.instantiate()'
      - name: Run the integration tier
        run: julia --project=test/integration test/integration/runtests.jl

  phonopy:
    name: phonopy export — convention gate
    runs-on: ubuntu-latest
    steps:
      # `write_phonopy` writes a POSITIONAL format: a matrix over supercell atom
      # indices, with the supercell built by phonopy from the unit cell and `--dim`.
      # Disagree with phonopy's ordering and the export is a permuted force-constant
      # matrix that still diagonalizes and still has three acoustic modes at Γ — no
      # self-contained round trip can see it. Only phonopy can settle the question,
      # so it is installed here and the comparison is against its own dynamical
      # matrix. The core suite keeps the half that does not need it
      # (`test/unit/test_latticeonly.jl`), because phonopy must never become a
      # dependency of `Pkg.test()`.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install phonopy
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate the phonopy environment
        run: julia --project=test/phonopy -e 'using Pkg; Pkg.instantiate()'
      - name: Run the phonopy suite
        run: julia --project=test/phonopy test/phonopy/runtests.jl
        env:
          PHONOPY_PYTHON: python
          JULIA_NUM_THREADS: "4"

  examples:
    name: runnable examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      # `examples/` carries its own environment (it `dev`s the package and adds
      # Spglib). Each example self-gates with `@assert`s on a recovered coupling —
      # the fence that caught the canonical-member J/2 regression — so they have to
      # RUN somewhere. The docs job executes the tutorials, not these.
      - name: Instantiate the examples environment
        run: julia --project=examples -e 'using Pkg; Pkg.instantiate()'
      - name: Run every example
        run: |
          for f in examples/*.jl; do
            echo "::group::$f"
            julia --project=examples "$f"
            echo "::endgroup::"
          done

  downstream:
    name: downstream — ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: SLCEMonteCarlo.jl
            devs: SLCE.jl
          - pkg: SLCETools.jl
            devs: SLCE.jl
          - pkg: SLCEDynamics.jl
            devs: SLCE.jl SLCEMonteCarlo.jl
    steps:
      # Each dependent package's OWN CI pins it against SLCE's main branch, but it
      # only fires when THAT repo is pushed. Nothing fired when SLCE changed — which
      # is how SLCEDynamics' main sat broken against the `isotropy` -> `soc` rename
      # and the `MCView` contract for days, on an unmerged branch nobody was told
      # about. This job closes that: the dependents are run against the SLCE commit
      # being pushed, here, now.
      #
      # A DELIBERATE breaking change turns this job red until the matching
      # downstream commit lands. That red is the signal, not a nuisance — CLAUDE.md
      # already says "a downstream rename is not done when SLCE's own tests are
      # green", and this is that sentence made executable. Do not delete the job to
      # get a green tick; land the downstream commit.
      - uses: actions/checkout@v4
        with:
          path: SLCE.jl
      - uses: actions/checkout@v4
        with:
          repository: Tomonori-Tanaka/SLCEMonteCarlo.jl
          path: SLCEMonteCarlo.jl
      - uses: actions/checkout@v4
        with:
          repository: Tomonori-Tanaka/SLCEDynamics.jl
          path: SLCEDynamics.jl
      - uses: actions/checkout@v4
        with:
          repository: Tomonori-Tanaka/SLCETools.jl
          path: SLCETools.jl
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      # The dev list travels as an environment variable and is split in Julia. Do not
      # "simplify" this by interpolating the paths into the `-e` string: the matrix
      # value would land inside a shell-quoted Julia string containing its own
      # quotes, which is a nesting hazard for no benefit.
      - name: Develop the path dependencies and instantiate
        env:
          DEVS: ${{ matrix.devs }}
        run: |
          julia --project=${{ matrix.pkg }} -e '
            using Pkg
            Pkg.develop([PackageSpec(path = p) for p in split(ENV["DEVS"])])
            Pkg.instantiate()'
      # Default TEST_MODE (unit + Aqua) on Linux only: this is the compatibility
      # smoke, and each dependent's own CI carries the full TEST_MODE=all matrix
      # across both operating systems. Threads still matter — the dependents'
      # serial-vs-parallel gates are vacuous at one thread.
      - name: Run the dependent's suite against this SLCE
        run: julia --project=${{ matrix.pkg }} -e 'using Pkg; Pkg.test()'
        env:
          JULIA_NUM_THREADS: "4"

  pins:
    name: pin tier — change detectors over the SALC chain
    runs-on: ubuntu-latest
    steps:
      # Byte-level change detectors, NOT correctness evidence: every expected
      # value in `test/pin/pins/*.toml` was produced by this package. They exist
      # because the numeric chain from the Reynolds projector to `evaluate_salc`
      # can change silently — every gate that reaches it is gauge- or
      # scale-invariant, so the output can move without anything going red.
      # `test/unit/test_normalization.jl` is the correctness side of that pair.
      #
      # Runs on ubuntu while the pins were captured on aarch64-Darwin, so the
      # numeric layers fall to the off-platform tolerance here — deliberately.
      # Whether the values are bitwise portable across platforms is UNMEASURED;
      # this job is what will measure it the day someone captures on Linux, and
      # until then it still gates L0 (structure) and L0' (support pattern), which
      # are exact everywhere.
      #
      # Both thread counts, every time: the basis build is threaded, and pinned
      # values that depend on the thread count are a race, not a pin.
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate the pin environment
        run: julia --project=test/pin -e 'using Pkg; Pkg.instantiate()'
      - name: Pins — 4 threads
        run: julia --project=test/pin -t 4 test/pin/runtests.jl
      - name: Pins — 1 thread
        run: julia --project=test/pin -t 1 test/pin/runtests.jl

  docs:
    name: documentation build
    runs-on: ubuntu-latest
    # `contents: write` is what lets `deploydocs` push the built site to the
    # `gh-pages` branch that GitHub Pages serves. Without it the build still runs and
    # still fails on a broken docstring — it just never publishes.
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate the docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path = pwd())); Pkg.instantiate()'
      - name: Build the Documenter site and deploy it to gh-pages
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
